<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#a85f28"/>
    </radialGradient>
    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fae6a"/>
      <stop offset="100%" stop-color="#2f7a42"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- gentle ripples -->
  <g stroke="#fff3df" stroke-width="7" fill="none" opacity="0.35">
    <path d="M60 420 Q 110 405 160 420 T 260 420 T 360 420 T 452 420"/>
    <path d="M40 450 Q 95 436 150 450 T 260 450 T 370 450 T 470 450"/>
  </g>

  <!-- legs -->
  <ellipse cx="128" cy="236" rx="34" ry="46" fill="#5fae6a" transform="rotate(-28 128 236)"/>
  <ellipse cx="384" cy="236" rx="34" ry="46" fill="#5fae6a" transform="rotate(28 384 236)"/>
  <ellipse cx="150" cy="336" rx="30" ry="40" fill="#5fae6a" transform="rotate(26 150 336)"/>
  <ellipse cx="362" cy="336" rx="30" ry="40" fill="#5fae6a" transform="rotate(-26 362 336)"/>

  <!-- head -->
  <circle cx="256" cy="162" r="48" fill="#73c17c"/>
  <circle cx="240" cy="152" r="7" fill="#1e3a24"/>
  <circle cx="272" cy="152" r="7" fill="#1e3a24"/>
  <path d="M238 176 Q 256 186 274 176" stroke="#1e3a24" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- shell -->
  <ellipse cx="256" cy="300" rx="150" ry="118" fill="url(#shell)" stroke="#1f5c30" stroke-width="6"/>
  <g stroke="#1f5c30" stroke-width="6" fill="none" opacity="0.8">
    <path d="M256 190 L256 410"/>
    <path d="M150 230 L362 230"/>
    <path d="M118 320 L394 320"/>
    <path d="M165 395 Q256 420 347 395"/>
    <path d="M170 215 Q256 195 342 215"/>
  </g>

  <!-- shine -->
  <ellipse cx="200" cy="250" rx="34" ry="18" fill="#ffffff" opacity="0.25" transform="rotate(-20 200 250)"/>
</svg>
