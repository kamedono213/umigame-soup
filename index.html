<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ウミガメのスープ</title>
  <meta name="theme-color" content="#2f5f6f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ウミガメ">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <nav id="bottomTabbar" class="bottom-tabbar">
    <button type="button" data-tab="battle"><span data-no-reading="true">🐢</span><span>バトル</span></button>
    <button type="button" data-tab="data"><span data-no-reading="true">📊</span><span>データ</span></button>
  </nav>
  <div id="emoteLayer" class="emote-layer" aria-hidden="true"></div>
  <div id="sideGame" class="side-game" hidden>
    <button id="sideGameBtn" type="button" class="side-game-btn" title="待ち時間に遊べる貝殻拾い">
      <span data-no-reading="true">🐚</span>
    </button>
    <div class="side-game-info">
      <span id="sideGameCount" class="side-game-count">0</span>
      <span id="sideGameCps" class="side-game-cps"></span>
    </div>
    <button id="sideGameShopBtn" type="button" class="side-game-shop-btn">🛒 店</button>
  </div>
  <div id="sideGameShop" class="side-game-shop" hidden>
    <div class="side-game-shop-head">
      <span>貝殻の店</span>
      <button id="sideGameShopClose" type="button" class="side-game-shop-close">✕</button>
    </div>
    <div id="sideGameShopTabs" class="side-game-shop-tabs"></div>
    <div id="sideGameShopList" class="side-game-shop-list"></div>
  </div>
  <div id="chatDock" class="chat-dock" hidden>
    <div class="chat-dock-head">
      <span>チャット</span>
      <div id="emotePicker" class="emote-picker"></div>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="メッセージを入力" autocomplete="off" maxlength="300">
      <button type="submit" class="chat-send-btn">送信</button>
    </form>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
