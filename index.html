<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ウミガメのスープ</title>
  <meta name="theme-color" content="#2f5f6f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ウミガメ">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <nav id="bottomTabbar" class="bottom-tabbar">
    <button type="button" data-tab="battle"><span data-no-reading="true">🐢</span><span>バトル</span></button>
    <button type="button" data-tab="data"><span data-no-reading="true">📊</span><span>データ</span></button>
  </nav>
  <button id="chatBar" type="button" class="chat-bar" hidden>
    <span class="chat-bar-icon" data-no-reading="true">💬</span>
    <span id="chatBarPreview" class="chat-bar-preview">チャット</span>
    <span id="chatBarBadge" class="chat-bar-badge" hidden>0</span>
  </button>
  <div id="chatPanel" class="chat-panel" hidden>
    <div class="chat-panel-head">
      <span>チャット</span>
      <button id="chatCloseBtn" type="button" class="chat-close-btn">✕</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="メッセージを入力" autocomplete="off" maxlength="300">
      <button type="submit" class="chat-send-btn">送信</button>
    </form>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
